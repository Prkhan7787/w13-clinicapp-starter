name: Build and deploy Node.js app to Azure Web App - app-clinicapp-api-prkhan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        working-directory: ./server
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./server

      - name: Login to Azure
        uses: azure/login@v2
        with:
         client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5B1941CFEDF348C4ADD31535C73E6AA7 }}
         tenant-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_86399FDA56B846D99B15DE969808A1DD }}
         subscription-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D82EA046D5A74C638C4F52DD01AF679C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-clinicapp-api-prkhan'
          slot-name: 'Production'
          package: ./server